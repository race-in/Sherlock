name: Gem glibc check
on: push
jobs:
  check:
    if: contains(github.event.head_commit.message, '[gemcheck]')
    runs-on: ubuntu-24.04
    steps:
      - name: Highest GLIBC / GLIBCXX symbol version each precompiled gem needs
        run: |
          set -u
          cd "$(mktemp -d)"
          for g in pg-1.7.0-x86_64-linux nokogiri-1.19.4-x86_64-linux-gnu prometheus-client-mmap-1.7.2-x86_64-linux-gnu tailwindcss-ruby-4.3.3-x86_64-linux-gnu tailwindcss-ruby-4.3.3-x86_64-linux-musl; do
            echo "=== $g"
            curl -fsSL "https://rubygems.org/downloads/$g.gem" -o "$g.gem" || { echo "download failed"; continue; }
            mkdir -p "$g/d" && tar -xf "$g.gem" -C "$g" && tar -xzf "$g/data.tar.gz" -C "$g/d"
            find "$g/d" -type f | while read -r f; do
              if file "$f" | grep -q 'ELF'; then
                gl=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
                cx=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBCXX_[0-9.]*' | sort -Vu | tail -1)
                echo "${f#"$g"/d/}: ${gl:-none} ${cx:-}"
              fi
            done
          done
