name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Debian installer checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          bash -n deploy/install-debian.sh
          shellcheck --shell=bash --severity=warning deploy/install-debian.sh deploy/test-rootless.sh
      - name: --help works
        run: bash deploy/install-debian.sh --help

  rootless:
    name: Rootless install (normal user)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL server programs (the runner user is not root)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql libpq-dev
      - name: Private cluster, schema load and sherlock-ctl as a normal user
        run: bash deploy/test-rootless.sh

  debian-packages:
    name: Debian ${{ matrix.version }} packages and PostgreSQL schema
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["12", "13"]
    container: debian:${{ matrix.version }}
    steps:
      - name: Install git and checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: The installer's apt packages exist on this release
        run: |
          # shellcheck disable=SC2046
          apt-get install --simulate --no-install-recommends $(bash deploy/install-debian.sh --print-packages) \
            postgresql-common nginx certbot python3-certbot-nginx
      - name: db/structure.sql loads on Debian's own PostgreSQL (without the PostgreSQL 17+ line on old servers)
        run: |
          apt-get install -y --no-install-recommends postgresql postgresql-client sudo
          pg_ctlcluster "$(pg_lsclusters -h | awk '{print $1; exit}')" main start || true
          sleep 3
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE s LOGIN PASSWORD 'x'" -c "CREATE DATABASE s OWNER s"
          major="$(pg_lsclusters -h | awk '{print $1; exit}')"
          if [ "$major" -lt 17 ]; then sed '/^SET transaction_timeout = 0;$/d' db/structure.sql > /tmp/structure.sql; else cp db/structure.sql /tmp/structure.sql; fi
          PGPASSWORD=x psql -h 127.0.0.1 -U s -d s -v ON_ERROR_STOP=1 -q -f /tmp/structure.sql
          PGPASSWORD=x psql -h 127.0.0.1 -U s -d s -Atc "SELECT count(*) FROM sherlockdb.schema_migrations"

  rails:
    name: Rails tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sherlockdb_develop_write
          POSTGRES_PASSWORD: sherlockdb_develop_write
          POSTGRES_DB: sherlockdb_develop
        ports: ["5448:5432"]
        options: >-
          --health-cmd "pg_isready -U sherlockdb_develop_write"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: bin/rails tailwindcss:build
      - run: bin/rails db:test:prepare
      - run: bin/rails test

  # A full rootless install (Ruby build, gems, assets, database, start, health check) on every supported release.
  # About 20 to 40 minutes each, so it runs on demand: put [e2e] in a commit message, or start it by hand.
  e2e:
    name: Full install on Debian ${{ matrix.version }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ["9", "10", "11", "12", "13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Sherlock as a normal user inside debian:${{ matrix.version }}
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:${{ matrix.version }} bash -eu -c '
            bash /src/deploy/install-debian.sh --prepare-system
            useradd -m tester
            cp -a /src /home/tester/Sherlock && chown -R tester:tester /home/tester/Sherlock
            runuser -u tester -- bash -eu -c "
              cd ~/Sherlock
              bash deploy/install-debian.sh --domain localhost:3000 -y
              curl -fsS http://127.0.0.1:3000/up; echo
              ~/.local/bin/sherlock-ctl stop"
          '
