name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest CI run for a branch or pull request.
# This prevents rapid development commits from filling the hosted-runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  upstream-source-audit:
    name: Upstream Rails source inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Clone and audit upstream Sherlock source
        run: |
          git clone --depth 1 --no-tags \
            https://codeberg.org/whatstatus/sherlock-v2.git \
            "$RUNNER_TEMP/sherlock-upstream"
          bash scripts/audit-upstream-source.sh "$RUNNER_TEMP/sherlock-upstream"

  lint:
    name: Shell and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            shellcheck yamllint ruby

      - name: Check Bash syntax
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path './vendor/*' \
              -print0 | sort -z
          )
          if (( ${#shell_files[@]} == 0 )); then
            echo "::error::No shell scripts found."
            exit 1
          fi
          for file in "${shell_files[@]}"; do
            echo "Checking ${file}"
            bash -n "$file"
          done

      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path './vendor/*' \
              -print0 | sort -z
          )
          shellcheck --shell=bash --severity=error "${shell_files[@]}"

      - name: Run deployment regression tests
        run: |
          bash scripts/test-native-patches.sh
          bash scripts/test-bullseye-archive.sh
          bash scripts/test-backup-restore.sh
          bash scripts/test-nginx-host-conflict.sh
          bash scripts/test-installer-contract.sh
          bash scripts/test-native-upgrade-safety.sh
          bash scripts/test-credentials-generation.sh
          bash scripts/test-prune-backups.sh
          bash sherlock-v2/deploy/feral/tests/shell-smoke.sh

      - name: Validate workflow YAML
        run: yamllint --strict -d relaxed .github/workflows/ci.yml

  rails-application:
    name: Rails application tests and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sherlockdb_develop_write
          POSTGRES_PASSWORD: sherlockdb_develop_write
          POSTGRES_DB: postgres
        ports:
          - 5448:5432
        options: >-
          --health-cmd "pg_isready -U sherlockdb_develop_write -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: sherlock-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.12.0"
          cache: npm
          cache-dependency-path: sherlock-v2/package-lock.json

      - name: Build frontend assets
        working-directory: sherlock-v2
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Rails, style, dependency and security checks
        working-directory: sherlock-v2
        env:
          CI: "true"
          APP_VERSION: v0.0.0-ci
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5448"
          TEST_DB_USER: sherlockdb_develop_write
          TEST_DB_PASSWORD: sherlockdb_develop_write
          TEST_DB_NAME: sherlockdb_test
        run: |
          chmod 0755 bin/*
          ./bin/ci

  debian-compatibility:
    name: Debian ${{ matrix.version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "11"
            image: debian:11-slim
          - version: "12"
            image: debian:12-slim
          - version: "13"
            image: debian:13-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Run platform compatibility check
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          DEBIAN_VERSION: ${{ matrix.version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "$DEBIAN_IMAGE" \
            bash -ec '
              bash scripts/compatibility-check.sh
              bash scripts/test-apt-dependencies.sh
              bash scripts/test-node-runtime.sh
              bash scripts/test-ruby-runtime.sh
            '
