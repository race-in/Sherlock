name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Shell and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            shellcheck yamllint ruby

      - name: Check Bash syntax
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path './vendor/*' \
              -print0 | sort -z
          )
          if (( ${#shell_files[@]} == 0 )); then
            echo "::error::No shell scripts found."
            exit 1
          fi
          for file in "${shell_files[@]}"; do
            echo "Checking ${file}"
            bash -n "$file"
          done

      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' shell_files < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path './vendor/*' \
              -print0 | sort -z
          )
          shellcheck --shell=bash --severity=error "${shell_files[@]}"

      - name: Run deployment regression tests
        run: |
          bash scripts/test-native-patches.sh
          bash scripts/test-bullseye-archive.sh
          bash scripts/test-backup-restore.sh
          bash scripts/test-nginx-host-conflict.sh
          bash scripts/test-installer-contract.sh
          bash scripts/test-credentials-generation.sh
          bash scripts/test-prune-backups.sh

      - name: Validate workflow YAML
        run: yamllint --strict -d relaxed .github/workflows/ci.yml

  debian-compatibility:
    name: Debian ${{ matrix.version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "11"
            image: debian:11-slim
          - version: "12"
            image: debian:12-slim
          - version: "13"
            image: debian:13-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run platform compatibility check
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          DEBIAN_VERSION: ${{ matrix.version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "$DEBIAN_IMAGE" \
            bash -ec '
              bash scripts/compatibility-check.sh
              bash scripts/test-apt-dependencies.sh
              bash scripts/test-node-runtime.sh
              bash scripts/test-ruby-runtime.sh
            '
